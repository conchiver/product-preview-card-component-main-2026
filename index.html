<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <script src="https://kit.fontawesome.com/88bef113f1.js" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>-->
</head>
<body>
  <main class="perfume">
      <picture class="perfume__imagen-contenedor">
        <source media="(min-width: 768px)" srcset="images/image-product-desktop.jpg">
        <img class="perfume__imagen" src="images/image-product-mobile.jpg" alt="Perfume">
      </picture>
     

     <div class="perfume__contenido">

          <p class="perfume__categoria">PERFUME</p>

          <h1 class="perfume__titulo">Gabrielle Essence Eau De Parfum</h1>

          <p class="perfume__descripcion">A floral, solar and voluptuous interpretation composed     by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>

          <div class="perfume__precio">
            <span class = "perfume__precio-rebajado">$149.99</span>
            <span class = "perfume__precio-original">$169.99</span>
          </div>
        

          <a href="" class="perfume__boton"><i class="fa-solid fa-cart-shopping"></i>Add to Cart</a>
     </div>
  </main>
</body>
</html>
